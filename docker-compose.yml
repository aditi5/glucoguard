services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: glucoguard
      POSTGRES_PASSWORD: glucoguard
      POSTGRES_DB: glucoguard
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glucoguard"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://glucoguard:glucoguard@db:5432/glucoguard?sslmode=disable
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
