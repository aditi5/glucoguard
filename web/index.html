<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlucoGuard</title>
<meta name="description" content="Log your glucose readings and see what to do next. Data stays on your phone.">
<meta name="theme-color" content="#1F2A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GlucoGuard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <span class="brand">GlucoGuard</span>
  <a class="call" href="tel:112" aria-label="Call emergency services, 112">Call 112</a>
</header>

<main id="app" tabindex="-1">
  <p class="loading" id="loading">Loading the safety checks…</p>
</main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="today" aria-current="page">Today</button>
  <button data-tab="history">History</button>
  <button data-tab="plan">My plan</button>
</nav>

<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="wasm_exec.js"></script>
<script src="app.js"></script>
</body>
</html>
